services:

  # ---------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-data:/var/lib/postgresql/data

      # Creates the QLFS warehouse database on first startup
      - ./sql/init:/docker-entrypoint-initdb.d

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ---------------------------------------------------------
  # Airflow API Server
  # ---------------------------------------------------------
  airflow-apiserver:
    build: .
    image: saedep-airflow:latest

    command: api-server

    ports:
      - "8080:8080"

    environment: &airflow-env

      # Airflow executor
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      # Do not load example DAGs
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # Airflow metadata database
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      # QLFS PostgreSQL warehouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: qlfs
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
      - airflow-tmp:/opt/airflow/tmp

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      airflow-dag-processor:
        condition: service_started


  # ---------------------------------------------------------
  # Airflow DAG Processor
  # ---------------------------------------------------------
  airflow-dag-processor:
    build: .
    image: saedep-airflow:latest

    command: dag-processor

    environment: *airflow-env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
      - airflow-tmp:/opt/airflow/tmp

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully


  # ---------------------------------------------------------
  # Airflow Scheduler
  # ---------------------------------------------------------
  airflow-scheduler:
    build: .
    image: saedep-airflow:latest

    command: scheduler

    environment: *airflow-env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
      - airflow-tmp:/opt/airflow/tmp

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      airflow-dag-processor:
        condition: service_started


  # ---------------------------------------------------------
  # Airflow Initialization
  # ---------------------------------------------------------
  airflow-init:
    build: .
    image: saedep-airflow:latest

    command: db migrate

    environment: *airflow-env

    volumes:
      - airflow-logs:/opt/airflow/logs
      - airflow-tmp:/opt/airflow/tmp

    depends_on:
      postgres:
        condition: service_healthy


# ---------------------------------------------------------
# Persistent Volumes
# ---------------------------------------------------------
volumes:

  # PostgreSQL data
  postgres-data:

  # Airflow logs
  airflow-logs:

  # Temporary Airflow files
  airflow-tmp:

